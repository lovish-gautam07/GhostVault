version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ghostvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghostvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml}
      POSTGRES_DB: ghostvault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghostvault-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://ghostvault:${POSTGRES_PASSWORD}@postgres:5432/ghostvault?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random chars) in a .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_URL: "http://localhost:3000"
      SMTP_HOST: "smtp.ethereal.email"
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      EMAIL_FROM: "GhostVault <noreply@ghostvault.com>"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ghostvault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
    depends_on:
      - backend

volumes:
  postgres_data:
