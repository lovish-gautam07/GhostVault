services:
  - type: web
    name: ghostvault-api
    runtime: node
    plan: starter
    region: oregon

    buildCommand: npm ci --include=dev && npx prisma generate --schema backend/prisma/production/schema.prisma

    preDeployCommand: npx prisma migrate deploy --schema backend/prisma/production/schema.prisma

    startCommand: npm run start --workspace=backend

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: ghostvault-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: FRONTEND_URL
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: 587

      - key: SMTP_SECURE
        value: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: EMAIL_FROM
        value: "GhostVault Security <noreply@ghostvault.com>"

databases:
  - name: ghostvault-db
    plan: starter
    region: oregon
    databaseName: ghostvault
    user: ghostvault_admin
