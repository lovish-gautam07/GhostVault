services:
  # GhostVault API Backend Web Service
  - type: web
    name: ghostvault-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ghostvault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false # Set to your deployed Vercel frontend URL
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "GhostVault Security <noreply@ghostvault.com>"

databases:
  # PostgreSQL Database
  - name: ghostvault-db
    plan: starter
    region: oregon
    databaseName: ghostvault
    user: ghostvault_admin
